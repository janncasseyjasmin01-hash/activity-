<!DOCTYPE html>
<html lang="em">
<meta charset="UTF-8">
<title> Create a Internet Mail Account </title>

<head>

<body>
    <h1> Create a Internet Mail Account </h1>

    <form>
        first Name <input type="text"><br><br>
        Last Name <input type="text"><br><br>
        Desired Login Name <input type="text">@gmail.com><br><br>
        Password <input type="password"><br><br>

        <input type="radio" name="gender" checked> Male<br>
        <input type="radio" name="gender"> Female<br><br>

        Birthday
        <input type="text" size="5">
        <select>
            <option> Select One-</option>
            <option> January </option>
            <option> February </option>
            <option> Match </option>
            <option> April </option>
            <option> May </option>
            <option> June </option>
            <option> July </option>
            <option> August </option>
            <option> September </option>
            <option> October </option>
            <option> November </option>
            <option> December </option>
        </select>
        <input type="text" size="8"><br><br>

        Typeyourself <textarea rows="4" cols="20"> </textarea>

        <input type="submit" value="Accept">
        <input type="reset" Value="Cancel">
    </form>


</body>
</head>

</html>
